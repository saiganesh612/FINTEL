name: FINTEL Pipeline

permissions:
  contents: write

on:
  schedule:
    # All times in UTC. Minutes shifted off :00/:30 to dodge GitHub's queue congestion.
    - cron: '37 3 * * 1-5'   # NSE_OPEN  — ~9:07 IST  (target 9:00)
    - cron: '37 6 * * 1-5'   # NSE_MID   — ~12:07 IST (target 12:00)
    - cron: '7 10 * * 1-5'   # NSE_CLOSE — ~15:37 IST (target 15:30)
    - cron: '37 13 * * 1-5'  # US_OPEN   — ~19:07 IST (target 19:00)
    - cron: '37 19 * * 1-5'  # US_CLOSE  — ~1:07 IST next day (target 1:00)
  workflow_dispatch:
    inputs:
      session:
        description: 'Session to run manually'
        required: true
        default: 'NSE_OPEN'
        type: choice
        options:
          - NSE_OPEN
          - NSE_MID
          - NSE_CLOSE
          - US_OPEN
          - US_CLOSE

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine session name
        id: session
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SESSION=${{ github.event.inputs.session }}" >> $GITHUB_ENV
          else
            case "${{ github.event.schedule }}" in
              "37 3 * * 1-5")  echo "SESSION=NSE_OPEN"  >> $GITHUB_ENV ;;
              "37 6 * * 1-5")  echo "SESSION=NSE_MID"   >> $GITHUB_ENV ;;
              "7 10 * * 1-5")  echo "SESSION=NSE_CLOSE" >> $GITHUB_ENV ;;
              "37 13 * * 1-5") echo "SESSION=US_OPEN"   >> $GITHUB_ENV ;;
              "37 19 * * 1-5") echo "SESSION=US_CLOSE"  >> $GITHUB_ENV ;;
              *) echo "SESSION=UNKNOWN" >> $GITHUB_ENV ;;
            esac
          fi

      - name: Run pipeline
        env:
          SESSION: ${{ env.SESSION }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          # REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python pipeline/run.py

      - name: Publish audit logs to dedicated branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts/audit
          publish_branch: audit-logs
          keep_files: true
          commit_message: "Audit logs — ${{ env.SESSION }} run #${{ github.run_number }}"

  prune-audit-logs:
    needs: run-pipeline
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout audit logs branch
        uses: actions/checkout@v4
        with:
          ref: audit-logs

      - name: Delete old run folders
        run: |
          KEEP_RUNS=150
          echo "KEEP_RUNS=$KEEP_RUNS" >> "$GITHUB_ENV"

          mapfile -t all_runs < <(ls -d run*/ 2>/dev/null | sed 's#run##;s#/##' | sort -n)
          total=${#all_runs[@]}

          if [ "$total" -gt "$KEEP_RUNS" ]; then
            to_remove=$((total - KEEP_RUNS))
            for i in $(seq 0 $((to_remove - 1))); do
              rm -rf "run${all_runs[$i]}"
            done
            echo "Deleted ${to_remove} old run folders (kept newest ${KEEP_RUNS})"
          else
            echo "Only ${total} run folders present, nothing to prune (limit: ${KEEP_RUNS})"
          fi

      - name: Commit pruned state
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Prune old audit logs — keeping last ${{ env.KEEP_RUNS }} runs"
          branch: audit-logs
