<line x1="340" y1="976" x2="340" y2="1016" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g><rect x="190" y="1016" width="300" height="56" rx="8" fill="#2C2C2A" stroke="#888780" stroke-width="0.5"/><text x="340" y="1036" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#D3D1C7">DeliveryAgent</text><text x="340" y="1056" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#B4B2A9">Sends email, logs run</text></g>

<text x="340" y="1104" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">Separate graph — Sunday only</text>
