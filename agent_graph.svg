<line x1="340" y1="212" x2="340" y2="252" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g><rect x="190" y="252" width="300" height="56" rx="8" fill="#04342C" stroke="#1D9E75" stroke-width="0.5"/><text x="340" y="272" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#9FE1CB">RelevanceFilterAgent</text><text x="340" y="292" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5DCAA5">4-pass keyword/macro filter</text></g>
