<svg width="680" height="1310" viewBox="0 0 680 1310" xmlns="http://www.w3.org/2000/svg" role="img">
<title>FINTEL end-state LangGraph — all 13 agents</title>
<desc>Full pipeline: Collector, Deduplicator, RelevanceFilter, NoiseScorer, Validator (done/ready) flow into a fork — a conditional DeepCheck branch and a parallel Fundamentals-then-Technical branch — which join into Tagger, SignalGenerator, Synthesizer, Delivery. SupervisorAgent runs as a separate weekly graph.</desc>
